<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — ShopEase</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body style="background:linear-gradient(135deg,var(--primary-light) 0%,#fff 50%,#ffeef8 100%);">
  <!-- Toast Container -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

  <div class="auth-wrapper">
    <div class="auth-card">
      <!-- Logo -->
      <div class="auth-logo">Shop<span style="color:var(--secondary)">Ease</span></div>
      <h4 class="auth-title">Welcome Back!</h4>
      <p class="auth-sub">Sign in to your account to continue</p>

      <!-- Social Login -->
      <div class="social-login row g-2 mb-3">
        <div class="col-6">
          <button class="btn btn-outline-secondary w-100" onclick="showToast('Social login coming soon!','info')">
            <i class="fab fa-google me-2 text-danger"></i>Google
          </button>
        </div>
        <div class="col-6">
          <button class="btn btn-outline-secondary w-100" onclick="showToast('Social login coming soon!','info')">
            <i class="fab fa-facebook me-2" style="color:#1877f2;"></i>Facebook
          </button>
        </div>
      </div>

      <div class="divider">or sign in with email</div>

      <!-- Login Form -->
      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label class="form-label" for="loginEmail">Email Address</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-envelope text-muted"></i></span>
            <input type="email" class="form-control" id="loginEmail" placeholder="you@example.com" autocomplete="email">
          </div>
          <div class="invalid-feedback" id="loginEmail-feedback"></div>
        </div>
        <div class="mb-3">
          <div class="d-flex justify-content-between">
            <label class="form-label" for="loginPassword">Password</label>
            <a href="#" class="text-primary-custom small" onclick="showToast('Password reset link sent!','info');return false;">Forgot password?</a>
          </div>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-lock text-muted"></i></span>
            <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
            <button type="button" class="btn btn-outline-secondary toggle-pass" data-target="#loginPassword">
              <i class="fas fa-eye"></i>
            </button>
          </div>
          <div class="invalid-feedback" id="loginPassword-feedback"></div>
        </div>
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="rememberMe">
            <label class="form-check-label small" for="rememberMe">Remember me</label>
          </div>
        </div>
        <button type="submit" class="btn btn-primary-custom w-100 py-2 fs-6">
          Sign In <i class="fas fa-arrow-right ms-1"></i>
        </button>
      </form>

      <div class="text-center mt-4">
        <span class="text-muted small">Don't have an account? </span>
        <a href="register.html" class="text-primary-custom fw-600 small">Create account</a>
      </div>

      <div class="mt-4 p-3 rounded-3 text-center" style="background:var(--primary-light);">
        <div class="small text-primary-custom fw-600">Demo Credentials</div>
        <div class="small text-muted mt-1">
          <strong>Email:</strong> demo@shopease.in<br>
          <strong>Password:</strong> demo123
        </div>
        <button class="btn btn-sm btn-primary-custom mt-2" onclick="fillDemo()">Use Demo Account</button>
      </div>

      <div class="text-center mt-3">
        <a href="../index.html" class="text-muted small">
          <i class="fas fa-arrow-left me-1"></i>Back to Home
        </a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    // Seed demo user
    document.addEventListener('DOMContentLoaded', () => {
      const users = JSON.parse(localStorage.getItem('ecom_users') || '[]');
      const demoExists = users.find(u => u.email === 'demo@shopease.in');
      if (!demoExists) {
        users.push({
          id: 1001,
          name: 'Demo User',
          email: 'demo@shopease.in',
          password: hashSimple('demo123'),
          createdAt: new Date().toISOString(),
          orders: []
        });
        localStorage.setItem('ecom_users', JSON.stringify(users));
      }
    });
    function fillDemo() {
      document.getElementById('loginEmail').value = 'demo@shopease.in';
      document.getElementById('loginPassword').value = 'demo123';
    }
  </script>
</body>
</html>
