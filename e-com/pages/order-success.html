<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed — ShopEase</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .success-wrapper {
      min-height: 80vh;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, var(--primary-light) 0%, #fff 60%);
    }
    .success-card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,.1);
      padding: 3rem;
      max-width: 600px;
      width: 100%;
      text-align: center;
    }
    .success-icon {
      width: 100px; height: 100px;
      background: linear-gradient(135deg, var(--success), #4caf50);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.5rem;
      font-size: 3rem;
      animation: popIn .5s cubic-bezier(.175,.885,.32,1.275);
    }
    @keyframes popIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .order-info-row { display: flex; justify-content: space-between; padding: .6rem 0; border-bottom: 1px solid var(--gray-200); font-size: .9rem; }
    .order-info-row:last-child { border-bottom: none; }
    .confetti { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; }
  </style>
</head>
<body>
  <div id="navbar-placeholder"></div>
  <canvas class="confetti" id="confettiCanvas"></canvas>

  <div class="success-wrapper py-5">
    <div class="success-card">
      <div class="success-icon">🎉</div>
      <h2 class="fw-800 mb-1" style="color:var(--dark);">Order Confirmed!</h2>
      <p class="text-muted mb-4">Thank you for shopping with ShopEase. Your order has been placed successfully!</p>

      <div class="p-3 rounded-3 text-start mb-4" style="background:var(--gray-100);">
        <div class="order-info-row">
          <span class="text-muted">Order ID</span>
          <span class="fw-700 text-primary-custom" id="orderIdDisplay">—</span>
        </div>
        <div class="order-info-row">
          <span class="text-muted">Order Date</span>
          <span class="fw-600" id="orderDateDisplay">—</span>
        </div>
        <div class="order-info-row">
          <span class="text-muted">Payment Method</span>
          <span class="fw-600" id="orderPaymentDisplay">—</span>
        </div>
        <div class="order-info-row">
          <span class="text-muted">Total Amount</span>
          <span class="fw-700 fs-5" id="orderTotalDisplay">—</span>
        </div>
        <div class="order-info-row">
          <span class="text-muted">Estimated Delivery</span>
          <span class="fw-600 text-success" id="orderDeliveryDisplay">—</span>
        </div>
      </div>

      <!-- Items Summary -->
      <div class="text-start mb-4" id="orderItemsSummary" style="max-height:200px;overflow-y:auto;"></div>

      <!-- Delivery Address -->
      <div class="p-3 rounded-3 text-start mb-4" style="background:#e8f5e9;border-left:4px solid var(--success);">
        <div class="d-flex gap-2 align-items-start">
          <i class="fas fa-map-marker-alt text-success mt-1"></i>
          <div>
            <div class="fw-700 small mb-1">Delivery Address</div>
            <div class="small text-muted" id="orderAddressDisplay">—</div>
          </div>
        </div>
      </div>

      <!-- Status Timeline -->
      <div class="p-3 rounded-3 mb-4" style="background:var(--primary-light);">
        <div class="d-flex justify-content-between align-items-center small">
          <div class="text-center">
            <div class="rounded-circle d-inline-flex align-items-center justify-content-center mb-1"
              style="width:32px;height:32px;background:var(--primary);color:#fff;">
              <i class="fas fa-check"></i>
            </div>
            <div class="fw-600">Confirmed</div>
          </div>
          <div style="flex:1;height:2px;background:var(--gray-200);margin:0 8px;margin-bottom:18px;"></div>
          <div class="text-center text-muted">
            <div class="rounded-circle d-inline-flex align-items-center justify-content-center mb-1"
              style="width:32px;height:32px;background:var(--gray-200);">
              <i class="fas fa-box"></i>
            </div>
            <div>Packed</div>
          </div>
          <div style="flex:1;height:2px;background:var(--gray-200);margin:0 8px;margin-bottom:18px;"></div>
          <div class="text-center text-muted">
            <div class="rounded-circle d-inline-flex align-items-center justify-content-center mb-1"
              style="width:32px;height:32px;background:var(--gray-200);">
              <i class="fas fa-truck"></i>
            </div>
            <div>Shipped</div>
          </div>
          <div style="flex:1;height:2px;background:var(--gray-200);margin:0 8px;margin-bottom:18px;"></div>
          <div class="text-center text-muted">
            <div class="rounded-circle d-inline-flex align-items-center justify-content-center mb-1"
              style="width:32px;height:32px;background:var(--gray-200);">
              <i class="fas fa-home"></i>
            </div>
            <div>Delivered</div>
          </div>
        </div>
      </div>

      <div class="d-flex gap-3 justify-content-center flex-wrap">
        <a href="../index.html" class="btn btn-primary-custom px-4">
          <i class="fas fa-home me-2"></i>Back to Home
        </a>
        <a href="products.html" class="btn btn-outline-custom px-4">
          <i class="fas fa-shopping-bag me-2"></i>Continue Shopping
        </a>
        <a href="profile.html#orders" class="btn btn-outline-secondary px-4">
          <i class="fas fa-box me-2"></i>My Orders
        </a>
      </div>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const order = JSON.parse(localStorage.getItem('ecom_last_order') || 'null');
      if (!order) { window.location.href = '../index.html'; return; }

      document.getElementById('orderIdDisplay').textContent = order.id;
      document.getElementById('orderDateDisplay').textContent = new Date(order.date).toLocaleDateString('en-IN', { day:'numeric', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit' });
      document.getElementById('orderPaymentDisplay').textContent = { cod:'Cash on Delivery', card:'Credit / Debit Card', upi:'UPI / Net Banking' }[order.paymentMethod] || order.paymentMethod;
      document.getElementById('orderTotalDisplay').textContent = formatPrice(order.total);

      const delivery = new Date(order.date);
      delivery.setDate(delivery.getDate() + 3);
      document.getElementById('orderDeliveryDisplay').textContent = delivery.toLocaleDateString('en-IN', { weekday:'long', day:'numeric', month:'long' });

      const addr = order.address;
      document.getElementById('orderAddressDisplay').textContent =
        `${addr.name}, ${addr.address}, ${addr.city}, ${addr.state} – ${addr.pincode} | ${addr.phone}`;

      document.getElementById('orderItemsSummary').innerHTML = order.items.map(item => `
        <div class="d-flex align-items-center gap-2 py-2 border-bottom small">
          <img src="${item.image}" style="width:40px;height:40px;object-fit:cover;border-radius:6px;">
          <span class="flex-grow-1">${item.name}</span>
          <span class="text-muted">×${item.qty}</span>
          <span class="fw-600">${formatPrice(item.price * item.qty)}</span>
        </div>`).join('');

      // Confetti
      launchConfetti();
    });

    function launchConfetti() {
      const canvas = document.getElementById('confettiCanvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const colors = ['#6c63ff','#f72585','#4cc9f0','#fca311','#2dc653'];
      const particles = Array.from({length: 120}, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height - canvas.height,
        r: Math.random() * 6 + 4,
        d: Math.random() * 60,
        color: colors[Math.floor(Math.random() * colors.length)],
        tilt: Math.floor(Math.random() * 10) - 10,
        tiltAngle: 0,
        tiltAngleIncrement: Math.random() * 0.07 + 0.05,
        speed: Math.random() * 2 + 1
      }));

      let frame = 0;
      const drop = () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          ctx.beginPath();
          ctx.lineWidth = p.r / 2;
          ctx.strokeStyle = p.color;
          ctx.moveTo(p.x + p.tilt + p.r / 4, p.y);
          ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r / 4);
          ctx.stroke();
          p.tiltAngle += p.tiltAngleIncrement;
          p.y += p.speed;
          p.tilt = Math.sin(p.tiltAngle) * 12;
          if (p.y > canvas.height) { p.y = -10; p.x = Math.random() * canvas.width; }
        });
        frame++;
        if (frame < 250) requestAnimationFrame(drop);
        else { ctx.clearRect(0, 0, canvas.width, canvas.height); }
      };
      drop();
    }
  </script>
</body>
</html>
